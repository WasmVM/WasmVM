# CI for WasmVM on GitLab.
#
# Mirrors the build+test matrix of .github/workflows/main.yml (gcc and clang,
# Release, ctest), and additionally builds each compiler with WASMVM_DEBUG off
# and on; main.yml builds only the default (off). The instance runners are
# untagged with run_untagged=true, so no `tags:` key is needed here.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - toolchain
  - build
  - docs

variables:
  GIT_DEPTH: "50"
  # Prebuilt toolchain image from test/Dockerfile. TOOLCHAIN_TAG must equal
  # `sha256sum test/Dockerfile | cut -c1-16`; toolchain-image checks it.
  TOOLCHAIN_TAG: a2f36aa2088eb3aa
  TOOLCHAIN_IMAGE: $CI_REGISTRY_IMAGE/ci-toolchain:$TOOLCHAIN_TAG
  # Console colours emit ANSI escapes that are not valid XML, which corrupts
  # the ctest JUnit report GitLab parses for the MR test widget.
  CMAKE_OPTS: >-
    -G Ninja
    -D CMAKE_BUILD_TYPE=Release
    -D CONSOLE_COLOR=OFF
    -D BUILD_DOCS=OFF

# The registry serves a Cloudflare Origin CA certificate, which is not in
# public trust stores. Fetch that root with a TLS-validating curl (busybox
# wget in the kaniko image does not validate certificates) and hand it to
# toolchain-image. Runs on every default-branch pipeline so the manual
# rebuild there always has it.
registry-ca:
  stage: toolchain
  image: curlimages/curl:8.23.0
  interruptible: true
  timeout: 5m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [test/Dockerfile]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes: [test/Dockerfile]
  script:
    - >-
      curl -fsSL --proto '=https' -o registry-ca.pem
      https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem
  artifacts:
    expire_in: 1 day
    paths:
      - registry-ca.pem

# Builds and pushes TOOLCHAIN_IMAGE with kaniko (no privileged runner needed).
# Runs automatically when test/Dockerfile changes; on the default branch it can
# also be started by hand to rebuild the same tag (e.g. for Ubuntu updates).
# Being in an earlier stage, it finishes before the build jobs pull the image.
toolchain-image:
  stage: toolchain
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  interruptible: true
  timeout: 30m
  needs: [registry-ca]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [test/Dockerfile]
    - if: $CI_COMMIT_BRANCH
      changes: [test/Dockerfile]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - actual="$(sha256sum test/Dockerfile | cut -c1-16)"
    - >-
      if [ "$actual" != "$TOOLCHAIN_TAG" ]; then
      echo "TOOLCHAIN_TAG is $TOOLCHAIN_TAG but test/Dockerfile hashes to $actual; update .gitlab-ci.yml.";
      exit 1;
      fi
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "$CI_REGISTRY"
      "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "dir://$CI_PROJECT_DIR/test"
      --dockerfile "$CI_PROJECT_DIR/test/Dockerfile"
      --destination "$TOOLCHAIN_IMAGE"
      --registry-certificate "$CI_REGISTRY=$CI_PROJECT_DIR/registry-ca.pem"

.cmake_build:
  stage: build
  image: $TOOLCHAIN_IMAGE
  interruptible: true
  timeout: 30m
  script:
    - cmake -S . -B build $CMAKE_OPTS -D CMAKE_C_COMPILER=$CC -D CMAKE_CXX_COMPILER=$CXX -D WASMVM_DEBUG=$WASMVM_DEBUG
    - cmake --build build --parallel
    - ctest --test-dir build --output-on-failure --output-junit ctest-report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: build/ctest-report.xml

build:
  extends: .cmake_build
  parallel:
    matrix:
      - CC: gcc
        CXX: g++
        WASMVM_DEBUG: ["OFF", "ON"]
      - CC: clang
        CXX: clang++
        WASMVM_DEBUG: ["OFF", "ON"]

# Catches Sphinx errors; does not publish. To serve on GitLab Pages, rename
# this job to `pages`, move the html to `public/`, and artifact that path.
docs:
  stage: docs
  image: $TOOLCHAIN_IMAGE
  interruptible: true
  timeout: 15m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [docs/**/*]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docs/**/*]
  script:
    - cmake -S . -B build -G Ninja -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTS=OFF
    - cmake --build build --target docs
  artifacts:
    expire_in: 1 week
    paths:
      - build/docs/html
